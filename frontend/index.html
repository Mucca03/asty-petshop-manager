<!doctype html>
<html lang="es" data-theme="base">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/paw.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7fb" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("asty-theme");
          document.documentElement.dataset.theme = storedTheme === "dracula" ? "dracula" : "base";
        } catch {
          document.documentElement.dataset.theme = "base";
        }
      })();
    </script>
    <title>Asty · Petshop Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
